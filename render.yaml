services:
  - type: web
    name: monopolisting-server
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build --workspace=@monopolisting/shared && npm run build --workspace=@monopolisting/server && npx prisma migrate deploy --schema apps/server/prisma/schema.prisma
    startCommand: npm run start --workspace=@monopolisting/server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
